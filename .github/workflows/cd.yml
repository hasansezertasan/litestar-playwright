---
name: CD
on:
  workflow_dispatch:
  release:
    types: [published]
jobs:
  publish-pypi:
    runs-on: ubuntu-latest
    name: Publish on PyPI
    permissions:
      id-token: write # IMPORTANT: Mandatory for Trusted Publishing (gh-action-pypi-publish)
      contents: write # IMPORTANT: Mandatory for GitHub Release
    # Specifying a GitHub environment is optional, but strongly encouraged
    environment:
      name: publish
      url: https://pypi.org/project/litestar-playwright/${{ github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version-file: .python-version
      - name: Setup uv
        id: setup-uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Restore cache
        if: steps.setup-uv.outputs.cache-hit == 'true'
        run: echo "Cache was restored"
      - name: Build the Package
        run: uv build --no-sources --quiet
      - name: Publish to PyPI
        run: uv publish --quiet --trusted-publishing always
      - name: Attach Build Artifacts to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} ./dist/* --clobber
